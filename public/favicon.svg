<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="#0c120c" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Shield outline -->
  <path d="M32 10 L48 16 V28 C48 39 41 49 32 54 C23 49 16 39 16 28 V16 Z"
        fill="#142616" stroke="url(#cyberGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Checkmark / Keyhole center -->
  <path d="M26 32 L30 36 L38 27" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
